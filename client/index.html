<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaveChat — Real-Time Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
<style>
:root{--bg:#0d1420;--card:#131d2e;--card2:#1a2740;--accent:#22c1c3;--accent2:#fdbb2d;--text:#e9eef7;--muted:#8494b3;--border:#24334f}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
#join{margin:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:min(92vw,380px);text-align:center}
h1{font-size:2rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
#join input{width:100%;margin:18px 0 12px;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:1rem;outline:none}
#join button{width:100%;background:var(--accent);border:none;color:#04262a;font-weight:700;padding:12px;border-radius:10px;font-size:1rem;cursor:pointer}
#app{display:none;height:100vh;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card)}
header h1{font-size:1.2rem}
#room{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;outline:none}
#users{margin-left:auto;color:var(--muted);font-size:.85rem;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;background:var(--card2);border-radius:14px;padding:8px 14px}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#1f8a8c,#22c1c3);color:#04262a}
.msg .who{font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:2px}
.msg.mine .who{color:#053a3d}
.msg .when{font-size:.65rem;color:var(--muted);margin-top:3px}
.sys{align-self:center;color:var(--muted);font-size:.78rem;font-style:italic}
#typing{color:var(--muted);font-size:.78rem;padding:0 16px 4px;min-height:18px;font-style:italic}
footer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);background:var(--card)}
footer input{flex:1;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;outline:none;font-size:1rem}
footer button{background:var(--accent);border:none;color:#04262a;font-weight:700;padding:12px 20px;border-radius:10px;cursor:pointer}
#status{font-size:.75rem;color:var(--accent2)}
</style>
</head>
<body>
<div id="join">
  <h1>WaveChat</h1>
  <p style="color:var(--muted);margin-top:6px">Real-time rooms over SignalR</p>
  <input id="name" maxlength="24" placeholder="Pick a username">
  <input id="roomname" maxlength="24" placeholder="Room (default: general)">
  <button id="joinbtn">Join chat</button>
</div>
<div id="app">
<header><h1>WaveChat</h1><input id="room" value="general"><span id="status">connecting…</span><span id="users"></span></header>
<main id="msgs"></main>
<div id="typing"></div>
<footer><input id="text" placeholder="Type a message…" maxlength="2000" autocomplete="off"><button id="send">Send</button></footer>
</div>
<script>
const HUB='https://wavechatmn.runasp.net/hub/chat';
const $=id=>document.getElementById(id);
let conn,me,room='general';
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(s){const d=new Date(s);return isNaN(d)?new Date(s+'Z'):d}
function addMsg(m,mine){
  const d=document.createElement('div');d.className='msg'+(mine?' mine':'');
  d.innerHTML=`<div class="who">${esc(m.username)}</div>${esc(m.text)}<div class="when">${fmt(m.sentAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9;
}
function addSys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('msgs').appendChild(d)}
async function join(){
  me=$('name').value.trim();if(!me)return;
  room=$('roomname').value.trim()||'general';$('room').value=room;
  conn=new signalR.HubConnectionBuilder().withUrl(HUB).withAutomaticReconnect().build();
  conn.on('Message',m=>addMsg(m,m.username===me));
  conn.on('History',h=>{$('msgs').innerHTML='';h.forEach(m=>addMsg(m,m.username===me));addSys('— joined #'+room+' —')});
  conn.on('Users',u=>{$('users').textContent='Online: '+u.join(', ')});
  conn.on('System',t=>addSys(t));
  conn.on('Typing',u=>{$('typing').textContent=u+' is typing…';clearTimeout(window._tt);window._tt=setTimeout(()=>$('typing').textContent='',2500)});
  conn.onreconnecting(()=>$('status').textContent='reconnecting…');
  conn.onreconnected(()=>{$('status').textContent='live';conn.invoke('Join',me,room)});
  await conn.start();
  $('status').textContent='live';
  await conn.invoke('Join',me,room);
  $('join').style.display='none';$('app').style.display='flex';
  $('text').focus();
}
$('joinbtn').onclick=join;
$('roomname').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
async function send(){const t=$('text').value.trim();if(!t||!conn)return;$('text').value='';await conn.invoke('SendMessage',t)}
$('send').onclick=send;
$('text').addEventListener('keydown',e=>{if(e.key==='Enter')send();else if(conn)conn.invoke('Typing')});
$('room').addEventListener('change',async()=>{room=$('room').value.trim()||'general';$('msgs').innerHTML='';await conn.invoke('Join',me,room)});
</script>
</body>
</html>
